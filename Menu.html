<!DOCTYPE html>
<html>
<head>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            background: #f5f5f5;
        }

        .menu-card {
            background-image: url('tere-image-ka-path.jpg'); /* 👈 Yaha image ka path daal */
            background-size: cover;
            background-position: center;
            width: 450px;
            min-height: 650px;
            padding: 80px 50px;
            box-sizing: border-box;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .menu-card h1 {
            font-family: 'Playfair Display', serif;
            font-size: 48px;
            font-weight: 700;
            letter-spacing: 10px;
            color: #6B4423; /* Brown */
            text-align: center;
            margin: 0 0 40px 0;
            position: relative;
            padding-bottom: 15px;
        }

        /* Fancy Underline */
        .menu-card h1::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 2px;
            background: #6B4423;
        }

        .menu-list {
            font-family: 'Cormorant Garamond', serif;
            font-size: 20px;
            font-weight: 600;
            color: #6B4423; /* Brown */
            list-style: none;
            padding: 0;
        }

        .menu-list li {
            display: flex;
            justify-content: space-between;
            margin: 18px 0;
            position: relative;
        }

        /* Dots wali line */
        .menu-list li::before {
            content: '';
            position: absolute;
            bottom: 5px;
            left: 0;
            right: 0;
            border-bottom: 1px dotted #6B4423;
            z-index: 0;
        }

        .item-name, .item-price {
            background-image: url("car.jpg"); /* 👈 BG repeat taaki dots chip jaye */
            background-size: 450px 650px;
            background-position: center;
            background-attachment: fixed;
            padding: 0 5px;
            position: relative;
            z-index: 1;
        }

        .item-price {
            font-weight: 400;
        }
    </style>
</head>
<body>
    <div class="menu-card">
        <h1>🍴MENU👩‍🍳</h1>
        <ul class="menu-list">
            <li><span class="item-name">Paneer Tikka</span><span class="item-price">₹250</span></li>
            <li><span class="item-name">Veg Biryani</span><span class="item-price">₹180</span></li>
            <li><span class="item-name">Dal Makhani</span><span class="item-price">₹160</span></li>
            <li><span class="item-name">Butter Naan</span><span class="item-price">₹40</span></li>
            <li><span class="item-name">Gulab Jamun</span><span class="item-price">₹80</span></li>
        </ul>
    </div>
</body>
</html>
